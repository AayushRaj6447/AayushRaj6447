<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%">
  <defs>
    <style>
      .card-bg {
        fill: #090d14;
        stroke: #76B900;
        stroke-width: 1.5px;
        rx: 12px;
      }
      .title-text {
        font-family: 'Orbitron', 'Segoe UI', Arial, sans-serif;
        font-weight: 700;
        font-size: 14px;
        fill: #76B900;
        letter-spacing: 1.5px;
      }
      .sub-text {
        font-family: 'Segoe UI', Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #94A3B8;
        letter-spacing: 0.5px;
      }
      .tag-text {
        font-family: 'Fira Code', Consolas, 'Courier New', monospace;
        font-size: 11px;
        fill: #00E5FF;
      }

      /* Box 1 Animation: CPU Core Pulse */
      @keyframes cpuPulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      .b1-core { animation: cpuPulse 2s infinite ease-in-out; fill: #76B900; }

      /* Box 2 Animation: Signal Wave Shift */
      @keyframes waveSlide {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-30px); }
      }
      .b2-wave { animation: waveSlide 1.5s infinite linear; stroke: #00E5FF; stroke-width: 2; fill: none; }

      /* Box 3 Animation: Radar Sweep */
      @keyframes radarRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .b3-sweep { animation: radarRotate 3s infinite linear; transform-origin: 45px 45px; stroke: #76B900; stroke-width: 2; stroke-linecap: round; }

      /* Box 4 Animation: Sonar Rings Expansion */
      @keyframes sonarExpand {
        0% { r: 4px; opacity: 1; stroke-width: 2px; }
        100% { r: 35px; opacity: 0; stroke-width: 0.5px; }
      }
      .b4-ring1 { animation: sonarExpand 2.2s infinite ease-out; stroke: #00E5FF; fill: none; }
      .b4-ring2 { animation: sonarExpand 2.2s infinite ease-out; animation-delay: 1.1s; stroke: #76B900; fill: none; }

      /* Box 5 Animation: Terminal Cursor Blink */
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .b5-cursor { animation: blink 0.9s infinite; fill: #76B900; }

      /* Box 6 Animation: Vertical Laser Scan */
      @keyframes laserMove {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(48px); }
      }
      .b6-laser { animation: laserMove 2s infinite ease-in-out; stroke: #00E5FF; stroke-width: 2; }
    </style>
  </defs>

  <!-- ==================== BOX 1: EMBEDDED SYSTEMS ==================== -->
  <g transform="translate(10, 10)">
    <rect class="card-bg" x="0" y="0" width="280" height="195" />
    <line x1="15" y1="15" x2="265" y2="15" stroke="#76B900" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.4"/>
    <circle cx="25" cy="30" r="4" class="b1-core" />
    <text x="38" y="34" class="title-text">EMBEDDED SYSTEMS</text>
    <text x="38" y="52" class="sub-text">STM32 • ESP32 • RTOS • C</text>
    
    <!-- Chip Outline & Pins -->
    <rect x="38" y="70" width="80" height="80" rx="8" fill="#06090e" stroke="#76B900" stroke-width="1"/>
    <path d="M 28 90 L 38 90 M 28 110 L 38 110 M 28 130 L 38 130" stroke="#76B900" stroke-width="2"/>
    <path d="M 118 90 L 128 90 M 118 110 L 128 110 M 118 130 L 128 130" stroke="#76B900" stroke-width="2"/>
    <path d="M 60 60 L 60 70 M 80 60 L 80 70 M 100 60 L 100 70" stroke="#76B900" stroke-width="2"/>
    <path d="M 60 150 L 60 160 M 80 150 L 80 160 M 100 150 L 100 160" stroke="#76B900" stroke-width="2"/>
    <!-- Pulsing Inner Core -->
    <rect class="b1-core" x="53" y="85" width="50" height="50" rx="4" />
    <text x="63" y="114" font-family="Arial, sans-serif" font-size="10" fill="#090d14" font-weight="900">ARM</text>

    <text x="140" y="100" class="tag-text">> SYSTEM_READY</text>
    <text x="140" y="120" class="tag-text">> FREQ: 168MHz</text>
    <text x="140" y="140" class="tag-text">> BARE-METAL</text>
    <text x="140" y="160" class="tag-text">> FREERTOS: OK</text>
  </g>

  <!-- ==================== BOX 2: VLSI & DIGITAL DESIGN ==================== -->
  <g transform="translate(310, 10)">
    <rect class="card-bg" x="0" y="0" width="280" height="195" />
    <line x1="15" y1="15" x2="265" y2="15" stroke="#00E5FF" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.4"/>
    <circle cx="25" cy="30" r="4" fill="#00E5FF" />
    <text x="38" y="34" class="title-text" fill="#00E5FF">VLSI &amp; DIGITAL DESIGN</text>
    <text x="38" y="52" class="sub-text">Verilog HDL • FPGA • ASIC Flow</text>

    <!-- Moving Waveform in Clipping Window -->
    <g transform="translate(35, 75)">
      <rect x="0" y="0" width="210" height="60" fill="#050a10" rx="6" stroke="#00E5FF" stroke-width="0.5"/>
      <svg x="5" y="5" width="200" height="50" viewBox="0 0 200 50">
        <g class="b2-wave">
          <path d="M 0 35 L 20 35 L 20 10 L 50 10 L 50 35 L 80 35 L 80 10 L 110 10 L 110 35 L 140 35 L 140 10 L 170 10 L 170 35 L 200 35 L 200 10 L 230 10"/>
        </g>
      </svg>
    </g>

    <text x="38" y="160" class="tag-text">> RTL SYNTHESIS: PASSED</text>
    <text x="38" y="176" class="tag-text">> LUT UTILIZATION: 42%</text>
  </g>

  <!-- ==================== BOX 3: ROS2 & ROBOTICS ==================== -->
  <g transform="translate(610, 10)">
    <rect class="card-bg" x="0" y="0" width="280" height="195" />
    <line x1="15" y1="15" x2="265" y2="15" stroke="#76B900" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.4"/>
    <circle cx="25" cy="30" r="4" fill="#76B900" />
    <text x="38" y="34" class="title-text">ROS2 &amp; AUTONOMY</text>
    <text x="38" y="52" class="sub-text">Robotics • Gazebo • MAVLink</text>

    <!-- Radar Graphic -->
    <g transform="translate(35, 70)">
      <circle cx="45" cy="45" r="40" fill="#050c07" stroke="#76B900" stroke-width="1"/>
      <circle cx="45" cy="45" r="26" fill="none" stroke="#76B900" stroke-width="0.5" stroke-dasharray="3,3"/>
      <circle cx="45" cy="45" r="12" fill="none" stroke="#76B900" stroke-width="0.5"/>
      <line x1="5" y1="45" x2="85" y2="45" stroke="#76B900" stroke-width="0.5" opacity="0.5"/>
      <line x1="45" y1="5" x2="45" y2="85" stroke="#76B900" stroke-width="0.5" opacity="0.5"/>

      <!-- Rotating Sweep Line -->
      <line class="b3-sweep" x1="45" y1="45" x2="80" y2="45" />
    </g>

    <g transform="translate(135, 75)">
      <text x="0" y="20" class="tag-text">> NAV2_NODE: ACTIVE</text>
      <text x="0" y="38" class="tag-text">> SLAM: MAPPING</text>
      <text x="0" y="56" class="tag-text">> KINEMATICS: OK</text>
    </g>

    <text x="38" y="170" class="tag-text">> INTELLIGENT MACHINES</text>
  </g>

  <!-- ==================== BOX 4: IOT & SMART SENSORS ==================== -->
  <g transform="translate(10, 225)">
    <rect class="card-bg" x="0" y="0" width="280" height="195" />
    <line x1="15" y1="15" x2="265" y2="15" stroke="#00E5FF" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.4"/>
    <circle cx="25" cy="30" r="4" fill="#00E5FF" />
    <text x="38" y="34" class="title-text" fill="#00E5FF">IOT &amp; SMART SENSORS</text>
    <text x="38" y="52" class="sub-text">MQTT • Wireless • Cloud Nodes</text>

    <!-- Sonar Emitter -->
    <g transform="translate(60, 110)">
      <circle class="b4-ring1" cx="0" cy="0" r="5" />
      <circle class="b4-ring2" cx="0" cy="0" r="5" />
      <circle cx="0" cy="0" r="5" fill="#00E5FF" />
    </g>

    <g transform="translate(130, 80)">
      <rect x="0" y="0" width="130" height="60" fill="#060e17" rx="6" stroke="#00E5FF" stroke-width="0.5"/>
      <text x="12" y="24" class="tag-text" fill="#76B900">UPTIME: 99.9%</text>
      <text x="12" y="44" class="tag-text">PACKETS: SYNCED</text>
    </g>

    <text x="38" y="165" class="tag-text">> SENSOR MESH CONNECTED</text>
    <text x="38" y="180" class="tag-text">> PROTOCOL: MQTT / HTTP</text>
  </g>

  <!-- ==================== BOX 5: FULL STACK & PYTHON ==================== -->
  <g transform="translate(310, 225)">
    <rect class="card-bg" x="0" y="0" width="280" height="195" />
    <line x1="15" y1="15" x2="265" y2="15" stroke="#76B900" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.4"/>
    <circle cx="25" cy="30" r="4" fill="#76B900" />
    <text x="38" y="34" class="title-text">FULL STACK &amp; PYTHON</text>
    <text x="38" y="52" class="sub-text">Python • JS • HTML • React • Node</text>

    <!-- Code Terminal -->
    <g transform="translate(30, 70)">
      <rect x="0" y="0" width="220" height="75" fill="#05080f" rx="6" stroke="#76B900" stroke-width="1"/>
      <circle cx="12" cy="12" r="3" fill="#FF5F56"/>
      <circle cx="22" cy="12" r="3" fill="#FFBD2E"/>
      <circle cx="32" cy="12" r="3" fill="#27C93F"/>

      <text x="12" y="34" class="tag-text" fill="#76B900">def init_system():</text>
      <text x="24" y="52" class="tag-text" fill="#00E5FF">return "Hardware + Web"</text>
      <rect class="b5-cursor" x="180" y="42" width="7" height="12"/>
    </g>

    <text x="38" y="165" class="tag-text">> PYTHON &amp; JS &amp; HTML READY</text>
    <text x="38" y="180" class="tag-text">> FULL STACK INTEGRATION</text>
  </g>

  <!-- ==================== BOX 6: VISION & AVIONICS ==================== -->
  <g transform="translate(610, 225)">
    <rect class="card-bg" x="0" y="0" width="280" height="195" />
    <line x1="15" y1="15" x2="265" y2="15" stroke="#00E5FF" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.4"/>
    <circle cx="25" cy="30" r="4" fill="#00E5FF" />
    <text x="38" y="34" class="title-text" fill="#00E5FF">VISION &amp; AVIONICS</text>
    <text x="38" y="52" class="sub-text">OpenCV • Drone Tech • PCB</text>

    <!-- Target Scanner Box -->
    <g transform="translate(35, 70)">
      <rect x="0" y="0" width="75" height="70" fill="#060c14" rx="4" stroke="#00E5FF" stroke-width="0.5"/>
      <line class="b6-laser" x1="5" y1="10" x2="70" y2="10"/>
      <circle cx="37" cy="35" r="3" fill="#00E5FF"/>
    </g>

    <g transform="translate(125, 75)">
      <text x="0" y="18" class="tag-text">> OPENCV: TRACKING</text>
      <text x="0" y="36" class="tag-text">> FPS: 60 REALTIME</text>
      <text x="0" y="54" class="tag-text">> AVIONICS: LOCKED</text>
    </g>

    <text x="38" y="165" class="tag-text">> HARDWARE + SOFTWARE + AI</text>
    <text x="38" y="180" class="tag-text">> HIGH PRECISION TARGETING</text>
  </g>
</svg>
