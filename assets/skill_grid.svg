<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%">
  <defs>
    <!-- Fonts & Styles -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&amp;family=Rajdhani:wght@600;700&amp;family=Fira+Code:wght@400;600&amp;display=swap');

      .card-bg {
        fill: #090d14;
        stroke: #76B900;
        stroke-width: 1.5px;
        rx: 12px;
        transition: all 0.3s ease;
      }
      
      .card-bg-subtle {
        fill: #0d131d;
        stroke: #00E5FF;
        stroke-width: 1px;
        stroke-dasharray: 4,4;
        rx: 12px;
      }

      .title-text {
        font-family: 'Orbitron', sans-serif;
        font-weight: 700;
        font-size: 14px;
        fill: #76B900;
        letter-spacing: 1.5px;
      }

      .sub-text {
        font-family: 'Rajdhani', sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #94A3B8;
        letter-spacing: 0.5px;
      }

      .tag-text {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        fill: #00E5FF;
      }

      /* Box 1 Animation: CPU Pulse & Clock Line */
      @keyframes cpuPulse {
        0%, 100% { fill-opacity: 0.2; stroke-width: 1px; }
        50% { fill-opacity: 0.8; stroke-width: 2.5px; filter: drop-shadow(0 0 8px #76B900); }
      }
      @keyframes clockWave {
        0% { stroke-dashoffset: 60; }
        100% { stroke-dashoffset: 0; }
      }
      .b1-core { animation: cpuPulse 2s infinite ease-in-out; stroke: #76B900; fill: #76B900; }
      .b1-wave { stroke: #76B900; stroke-dasharray: 30; animation: clockWave 1.8s infinite linear; }

      /* Box 2 Animation: Oscillating Waveform */
      @keyframes waveDraw {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes gateGlow {
        0%, 100% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1.02); filter: drop-shadow(0 0 6px #00E5FF); }
      }
      .b2-wave { stroke: #00E5FF; stroke-width: 2; fill: none; stroke-dasharray: 120; animation: waveDraw 2s infinite linear; }
      .b2-gate { animation: gateGlow 1.6s infinite ease-in-out; transform-origin: center; }

      /* Box 3 Animation: Rotating Radar Scan */
      @keyframes radarSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes targetPing {
        0%, 100% { r: 3px; opacity: 0.3; }
        50% { r: 6px; opacity: 1; fill: #76B900; filter: drop-shadow(0 0 8px #76B900); }
      }
      .b3-radar { animation: radarSpin 3.5s linear infinite; transform-origin: 760px 80px; }
      .b3-target { animation: targetPing 1.5s infinite ease-in-out; }

      /* Box 4 Animation: IoT Sonar Rings */
      @keyframes sonarRing {
        0% { r: 5px; opacity: 1; stroke-width: 2px; }
        100% { r: 28px; opacity: 0; stroke-width: 0.5px; }
      }
      .b4-ring1 { animation: sonarRing 2.2s infinite cubic-bezier(0.1, 0.8, 0.3, 1); stroke: #00E5FF; fill: none; }
      .b4-ring2 { animation: sonarRing 2.2s infinite cubic-bezier(0.1, 0.8, 0.3, 1); animation-delay: 1.1s; stroke: #76B900; fill: none; }

      /* Box 5 Animation: Terminal Cursor & Code Glow */
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes codeFlow {
        0% { width: 0px; }
        70%, 100% { width: 90px; }
      }
      .b5-cursor { animation: cursorBlink 0.9s infinite; fill: #76B900; }
      .b5-line { animation: codeFlow 3s infinite steps(20); fill: #00E5FF; }

      /* Box 6 Animation: Laser Scan & Target Bracket */
      @keyframes laserScan {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(45px); }
      }
      @keyframes bracketGlow {
        0%, 100% { stroke: #76B900; }
        50% { stroke: #00E5FF; filter: drop-shadow(0 0 6px #00E5FF); }
      }
      .b6-laser { animation: laserScan 2.2s infinite ease-in-out; stroke: #76B900; stroke-width: 1.5; }
      .b6-bracket { animation: bracketGlow 2s infinite ease-in-out; fill: none; stroke-width: 2; }
    </style>

    <!-- Glowing Filters -->
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- GRID CONTAINER (3 Columns x 2 Rows) -->

  <!-- ==================== BOX 1: EMBEDDED & STM32 ==================== -->
  <g transform="translate(10, 10)">
    <rect class="card-bg" x="0" y="0" width="280" height="195" />
    <!-- Top HUD Header -->
    <path d="M 15 15 L 265 15" stroke="#76B900" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.4"/>
    <circle cx="25" cy="30" r="4" class="b1-core" />
    <text x="38" y="34" class="title-text">EMBEDDED SYSTEMS</text>
    <text x="38" y="52" class="sub-text">STM32 • ESP32 • RTOS • C</text>
    
    <!-- Graphic Elements -->
    <rect x="38" y="70" width="80" height="80" rx="8" fill="#06090e" stroke="#76B900" stroke-width="1"/>
    <!-- CPU Microchip Pins -->
    <path d="M 28 90 L 38 90 M 28 110 L 38 110 M 28 130 L 38 130" stroke="#76B900" stroke-width="2"/>
    <path d="M 118 90 L 128 90 M 118 110 L 128 110 M 118 130 L 128 130" stroke="#76B900" stroke-width="2"/>
    <path d="M 60 60 L 60 70 M 80 60 L 80 70 M 100 60 L 100 70" stroke="#76B900" stroke-width="2"/>
    <path d="M 60 150 L 60 160 M 80 150 L 80 160 M 100 150 L 100 160" stroke="#76B900" stroke-width="2"/>
    <!-- Inner Core -->
    <rect x="53" y="85" width="50" height="50" rx="4" class="b1-core" />
    <text x="63" y="114" font-family="'Orbitron'" font-size="10" fill="#090d14" font-weight="900">ARM</text>

    <!-- Oscilloscope Line -->
    <path class="b1-wave" d="M 140 110 L 160 110 L 165 90 L 175 130 L 185 80 L 195 120 L 200 110 L 250 110" fill="none" stroke-width="2"/>
    
    <text x="140" y="160" class="tag-text">> SYSTEM_READY</text>
    <text x="140" y="176" class="tag-text">> FREQ: 168MHz</text>
  </g>

  <!-- ==================== BOX 2: VLSI & VERILOG ==================== -->
  <g transform="translate(310, 10)">
    <rect class="card-bg" x="0" y="0" width="280" height="195" />
    <path d="M 15 15 L 265 15" stroke="#00E5FF" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.4"/>
    <circle cx="25" cy="30" r="4" fill="#00E5FF" filter="url(#glow-cyan)"/>
    <text x="38" y="34" class="title-text" fill="#00E5FF">VLSI &amp; DIGITAL DESIGN</text>
    <text x="38" y="52" class="sub-text">Verilog HDL • FPGA • ASIC Flow</text>

    <!-- Logic Gate & Waveform Graphic -->
    <g class="b2-gate" transform="translate(30, 75)">
      <!-- AND Gate Silhouette -->
      <path d="M 10 10 L 40 10 C 65 10 65 50 40 50 L 10 50 Z" fill="#09141d" stroke="#00E5FF" stroke-width="1.5"/>
      <line x1="0" y1="20" x2="10" y2="20" stroke="#00E5FF" stroke-width="1.5"/>
      <line x1="0" y1="40" x2="10" y2="40" stroke="#00E5FF" stroke-width="1.5"/>
      <line x1="58" y1="30" x2="75" y2="30" stroke="#00E5FF" stroke-width="1.5"/>
    </g>

    <!-- Digital Signal Pulse animation -->
    <g transform="translate(125, 80)">
      <rect x="0" y="0" width="135" height="55" fill="#050a10" rx="6" stroke="#00E5FF" stroke-width="0.5"/>
      <path class="b2-wave" d="M 10 40 L 30 40 L 30 15 L 60 15 L 60 40 L 90 40 L 90 15 L 120 15"/>
    </g>

    <text x="38" y="160" class="tag-text">> RTL SYNTHESIS: PASSED</text>
    <text x="38" y="176" class="tag-text">> LUT UTIL: 42% [OPTIMAL]</text>
  </g>

  <!-- ==================== BOX 3: ROS2 & ROBOTICS ==================== -->
  <g transform="translate(610, 10)">
    <rect class="card-bg" x="0" y="0" width="280" height="195" />
    <path d="M 15 15 L 265 15" stroke="#76B900" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.4"/>
    <circle cx="25" cy="30" r="4" fill="#76B900" />
    <text x="38" y="34" class="title-text">ROS2 &amp; AUTONOMY</text>
    <text x="38" y="52" class="sub-text">Robotics • Gazebo • MAVLink</text>

    <!-- Rotating Radar Graphic -->
    <g transform="translate(35, 70)">
      <circle cx="45" cy="45" r="40" fill="#050c07" stroke="#76B900" stroke-width="1"/>
      <circle cx="45" cy="45" r="28" fill="none" stroke="#76B900" stroke-width="0.5" stroke-dasharray="3,3"/>
      <circle cx="45" cy="45" r="14" fill="none" stroke="#76B900" stroke-width="0.5"/>
      <line x1="5" y1="45" x2="85" y2="45" stroke="#76B900" stroke-width="0.5" opacity="0.5"/>
      <line x1="45" y1="5" x2="45" y2="85" stroke="#76B900" stroke-width="0.5" opacity="0.5"/>
      
      <!-- Target points -->
      <circle cx="60" cy="30" class="b3-target" />
      <circle cx="30" cy="65" class="b3-target" style="animation-delay: 0.7s;"/>

      <!-- Radar Scanner Sweep line -->
      <g transform="translate(-715, -35)">
        <line class="b3-radar" x1="760" y1="80" x2="798" y2="80" stroke="#76B900" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Robot Telemetry Text -->
    <g transform="translate(135, 75)">
      <text x="0" y="20" class="tag-text">> NAV2_NODE: ACTIVE</text>
      <text x="0" y="38" class="tag-text">> SLAM: MAPPING</text>
      <text x="0" y="56" class="tag-text">> KINEMATICS: OK</text>
    </g>

    <text x="38" y="170" class="tag-text">> INTELLIGENT MACHINES</text>
  </g>

  <!-- ==================== BOX 4: IOT & TELEMETRY ==================== -->
  <g transform="translate(10, 225)">
    <rect class="card-bg" x="0" y="0" width="280" height="195" />
    <path d="M 15 15 L 265 15" stroke="#00E5FF" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.4"/>
    <circle cx="25" cy="30" r="4" fill="#00E5FF" />
    <text x="38" y="34" class="title-text" fill="#00E5FF">IOT &amp; SMART SENSORS</text>
    <text x="38" y="52" class="sub-text">MQTT • Wireless • Cloud Nodes</text>

    <!-- Sonar Signal Emitter -->
    <g transform="translate(60, 110)">
      <circle class="b4-ring1" cx="0" cy="0" r="10" />
      <circle class="b4-ring2" cx="0" cy="0" r="10" />
      <circle cx="0" cy="0" r="6" fill="#00E5FF" />
    </g>

    <g transform="translate(130, 80)">
      <rect x="0" y="0" width="130" height="60" fill="#060e17" rx="6" stroke="#00E5FF" stroke-width="0.5"/>
      <text x="12" y="24" class="tag-text" fill="#76B900">UPTIME: 99.9%</text>
      <text x="12" y="44" class="tag-text">PACKETS: SYNCED</text>
    </g>

    <text x="38" y="165" class="tag-text">> SENSOR MESH CONNECTED</text>
    <text x="38" y="180" class="tag-text">> PROTOCOL: MQTT / HTTP</text>
  </g>

  <!-- ==================== BOX 5: FULL STACK & PYTHON ==================== -->
  <g transform="translate(310, 225)">
    <rect class="card-bg" x="0" y="0" width="280" height="195" />
    <path d="M 15 15 L 265 15" stroke="#76B900" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.4"/>
    <circle cx="25" cy="30" r="4" fill="#76B900" />
    <text x="38" y="34" class="title-text">FULL STACK &amp; PYTHON</text>
    <text x="38" y="52" class="sub-text">Python • JS • HTML • React • Node</text>

    <!-- Code Editor Box -->
    <g transform="translate(30, 70)">
      <rect x="0" y="0" width="220" height="75" fill="#05080f" rx="6" stroke="#76B900" stroke-width="1"/>
      <!-- Window controls -->
      <circle cx="12" cy="12" r="3" fill="#FF5F56"/>
      <circle cx="22" cy="12" r="3" fill="#FFBD2E"/>
      <circle cx="32" cy="12" r="3" fill="#27C93F"/>

      <!-- Animated terminal typing -->
      <text x="12" y="34" font-family="'Fira Code', monospace" font-size="11" fill="#76B900">def init_system():</text>
      <text x="24" y="52" font-family="'Fira Code', monospace" font-size="11" fill="#00E5FF">return "AI + Hardware"</text>
      <!-- Cursor -->
      <rect class="b5-cursor" x="168" y="42" width="7" height="12"/>
    </g>

    <text x="38" y="165" class="tag-text">> NO C++ FOUND | PYTHON &amp; JS READY</text>
    <text x="38" y="180" class="tag-text">> WEB + EMBEDDED INTEGRATION</text>
  </g>

  <!-- ==================== BOX 6: VISION & DRONES ==================== -->
  <g transform="translate(610, 225)">
    <rect class="card-bg" x="0" y="0" width="280" height="195" />
    <path d="M 15 15 L 265 15" stroke="#00E5FF" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.4"/>
    <circle cx="25" cy="30" r="4" fill="#00E5FF" />
    <text x="38" y="34" class="title-text" fill="#00E5FF">VISION &amp; AVIONICS</text>
    <text x="38" y="52" class="sub-text">OpenCV • Drone Tech • PCB</text>

    <!-- Target Tracking HUD Box -->
    <g transform="translate(35, 70)">
      <rect x="0" y="0" width="75" height="70" fill="#060c14" rx="4"/>
      <!-- HUD Brackets -->
      <path class="b6-bracket" d="M 5 15 L 5 5 L 15 5 M 60 5 L 70 5 L 70 15 M 70 55 L 70 65 L 60 65 M 15 65 L 5 65 L 5 55"/>
      <!-- Scanner Line -->
      <line class="b6-laser" x1="5" y1="12" x2="70" y2="12"/>
      <circle cx="37" cy="35" r="3" fill="#00E5FF"/>
    </g>

    <g transform="translate(125, 75)">
      <text x="0" y="18" class="tag-text">> OPENCV: TRACKING</text>
      <text x="0" y="36" class="tag-text">> FPS: 60 REALTIME</text>
      <text x="0" y="54" class="tag-text">> AVIONICS: LOCKED</text>
    </g>

    <text x="38" y="165" class="tag-text">> HARDWARE + SOFTWARE + AI</text>
    <text x="38" y="180" class="tag-text">> HIGH PRECISION TARGETING</text>
  </g>
</svg>
